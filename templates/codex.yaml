# Codex engine preferences for this project.
# Written by `/setup` (Phase 3.5) when the Codex CLI is detected; safe to edit by
# hand and commit. Everything here is FAIL-CLOSED: if the `codex` binary is
# missing or broken at runtime, the Test Lead silently uses Claude-internal
# agents regardless of what this file says. See CODEX_INTEGRATION.md.

# How the Test Lead uses Codex when it is available:
#   worker   — offload test-case packages to `codex exec`; Codex returns the
#              content, the Lead writes the files and runs the two-pass review.
#   reviewer — Claude's qa-engineer writes the cases; Codex gives an independent
#              second-opinion review that the Lead folds into its own.
#   off      — never use Codex; Claude-internal agents only (the default).
codex_role: off

# Default for the optional second-opinion review path:
#   auto — use Codex if it is available (no-op when codex_role is off)
#   on   — prefer Codex, degrade to internal if the binary is missing
#   off  — never request a Codex second opinion
codex_review: auto
